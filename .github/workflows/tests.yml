name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # composer setup runs `artisan migrate --force` against the REAL .env
    # (copied from .env.example, which points at MariaDB via Sail — there is
    # no database service in this workflow). Real env vars beat .env values
    # (phpdotenv is immutable), so this overrides it to sqlite: no service
    # container needed, matching the documented no-Docker path (README §7)
    # and the sqlite:memory: the test run itself already uses (phpunit.xml) —
    # that later override applies only within the PHPUnit process.
    env:
      DB_CONNECTION: sqlite
      DB_DATABASE: database/database.sqlite

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.3'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check
