; MenuTag Generator — override of vendor/laravel/sail/runtimes/8.5/supervisord.conf
;
; Identical to Sail's template except for startretries on [program:php]. On a
; freshly created database, worker/scheduler start alongside mariadb/laravel.test
; (docker-compose depends_on only waits for mariadb to be HEALTHY, which says
; nothing about whether migrations have run yet) and immediately crash on a
; missing table. Sail's default startretries=3 exhausts in well under a
; second, so supervisor gives up and marks the program FATAL for good — it
; never retries again, even after `migrate:fresh --seed` finishes moments
; later. Raising it to 50 keeps worker/scheduler crash-looping long enough to
; survive that window; the counter resets on the first successful start
; (stays up >= startsecs), so this has no effect once migrations exist.

[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid

[program:php]
command=%(ENV_SUPERVISOR_PHP_COMMAND)s
user=%(ENV_SUPERVISOR_PHP_USER)s
environment=LARAVEL_SAIL="1"
startretries=50
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
